name: 주식 타이밍 알람

on:
  schedule:
    - cron: "*/30 0-6 * * 1-5"
    - cron: "50 6 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stock-alarm
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 지표 계산 · 알림 · 대시보드 갱신
        run: python alarm.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PORTFOLIO_JSON: ${{ secrets.PORTFOLIO_JSON }}
          SHOW_PORTFOLIO: ${{ vars.SHOW_PORTFOLIO }}

      - name: 결과 저장
        run: |
          git config user.name "stock-alarm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json docs/index.html
          git diff --cached --quiet || (git commit -m "대시보드 갱신 $(TZ=Asia/Seoul date '+%m-%d %H:%M')" && git push)
